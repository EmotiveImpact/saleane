name: Saleane checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare Prettier output for the branch
        shell: bash
        run: |
          npx prettier --write src/main.tsx src/FrontDoor.tsx src/pages/MarketingHome.tsx src/pages/MarketingHome.test.tsx src/pages/marketing-home.css docs/evidence/PUBLIC-WEBSITE-2026-10-10.md README.md CHANGELOG.md
          node - <<'NODE'
          const fs = require('node:fs')
          const paths = [
            'src/main.tsx',
            'src/FrontDoor.tsx',
            'src/pages/MarketingHome.tsx',
            'src/pages/MarketingHome.test.tsx',
            'src/pages/marketing-home.css',
            'docs/evidence/PUBLIC-WEBSITE-2026-10-10.md',
            'README.md',
          ]
          for (const path of paths) {
            const contents = fs.readFileSync(path, 'utf8')
            console.log('@@PRETTIER:' + path + ':' + JSON.stringify(contents))
          }
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          const prefix = changelog.split('## 2026-10-10 · Claude behind Ask SALEANE')[0]
          console.log('@@PRETTIER:CHANGELOG-TOP:' + JSON.stringify(prefix))
          NODE
